<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER HUMAN 4P</title><style>body{background:#101729;color:#fff;font:bold 16px monospace;max-width:1000px;margin:auto;padding:15px}h1{color:#ffdc58;font-style:italic;margin:4px 0}canvas{width:100%;image-rendering:pixelated;border:3px solid #526381;box-sizing:border-box}#hud,#controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.card{background:#202c45;padding:10px;border-top:4px solid var(--c);min-width:0;overflow-wrap:anywhere}.meter{height:12px;background:#070d18;margin:8px 0}.fill{height:100%;background:var(--c);width:0}button{font:inherit;cursor:pointer;color:white;background:#344866;border:0;border-bottom:4px solid #17253c;padding:12px;border-radius:6px;touch-action:manipulation}button:active,.pressed{transform:translateY(3px);filter:brightness(1.5)}#status{color:#ffdc58;font-size:20px;min-height:28px}@media(max-width:650px){#hud{grid-template-columns:repeat(2,1fr)}}input{font:inherit;padding:12px;max-width:95%;box-sizing:border-box;margin:4px}#controls{grid-template-columns:1fr 1fr}#controls button{min-height:90px;font-size:24px;background:#b94b43;user-select:none}#controls button+button{background:#2865b7}button:disabled{opacity:.45}#room{color:#ffdc58}</style><h1>SUPER HUMAN / ONLINE 4P</h1><p>1500M EXTREME DASH · 온라인 4인 대전</p><div id="lobby"><input id="name" maxlength="16" placeholder="닉네임"><button id="create">방 만들기</button><br><input id="code" maxlength="6" placeholder="방 코드"><button id="join">방 참가</button></div><p id="room"></p><canvas width="800" height="420"></canvas><div id="hud"></div><div id="status" aria-live="polite">친구들과 방에 입장하세요.</div><div id="controls"><button id="left" disabled>A · 왼발</button><button id="right" disabled>B · 오른발</button></div><button id="start" disabled>▶ START / 재경기</button> <button id="sound">소리 ON</button> <button id="copy" hidden>초대 링크 복사</button><p>좌우 교차 연타 · PC A/D · 4명 입장 후 방장이 시작</p><script>
const $=s=>document.getElementById(s),c=document.querySelector('canvas'),g=c.getContext('2d'),hud=$('hud'),status=$('status'),colors=['#f34b43','#45b9f5','#52dc95','#e7b74c'],D=1500;let P=[],active=false,order=[],me=null,ws=null,audio=null,sound=true,last=-1,phase='lobby',room='',t=0;for(let i=0;i<4;i++)hud.innerHTML+='<div class="card" style="--c:'+colors[i]+'"><div id="n'+i+'">'+(i+1)+'P · 대기</div><div class="meter"><div class="fill" id="m'+i+'"></div></div><div id="d'+i+'">0m</div></div>';
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d))}function connect(type){if(ws&&ws.readyState<2)return;const name=$('name').value.trim();if(!name){status.textContent='닉네임을 입력하세요.';return}ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');ws.onopen=()=>send({type,name,code:$('code').value.trim()});ws.onclose=()=>{status.textContent='연결 종료. 다시 입장하세요.';me=null;active=false;phase='lobby';$('lobby').hidden=false;$('start').disabled=$('left').disabled=$('right').disabled=true;$('copy').hidden=true};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='error'){alert(d.message);ws.close();return}if(d.type==='joined'){me=d.id;room=d.code;$('lobby').hidden=true;$('copy').hidden=false;return}if(d.type!=='state')return;if(phase!==d.phase&&d.phase==='countdown')last=-1;phase=d.phase;P=d.players;order=d.order;t=d.t;active=phase==='race'||phase==='countdown';$('room').textContent='ROOM '+d.code+' · '+P.length+'/4 · 내 번호 '+(me+1)+'P';$('start').disabled=!(me===d.host&&P.length===4&&['lobby','finished'].includes(phase));$('left').disabled=$('right').disabled=phase!=='race'||P.find(p=>p.i===me)?.time!=null;for(let i=0;i<4;i++){let p=P.find(p=>p.i===i);$('n'+i).textContent=(i+1)+'P '+(p?p.name:'대기')+(i===me?' (나)':'');if(!p){$('m'+i).style.width='0%';$('d'+i).textContent='대기'}}status.textContent=phase==='lobby'?'4명 모이면 방장이 시작합니다.':phase==='countdown'?'출발까지 '+Math.ceil(-t)+'초':phase==='finished'?'경기 종료 · '+order.map((i,j)=>(j+1)+'위 '+(P.find(p=>p.i===i)?.name||'퇴장')+' '+(P.find(p=>p.i===i)?.time?.toFixed(2)||'—')+'초').join(' | ')+(order.length<4?' · 미완주 '+(4-order.length)+'명':''):'GO! 좌우 교차 연타!';draw(t)}}
function tone(){if(!sound)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});let o=audio.createOscillator(),n=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(42,t+.065);n.gain.setValueAtTime(.12,t);n.gain.exponentialRampToValueAtTime(.001,t+.075);o.connect(n);n.connect(audio.destination);o.start();o.stop(t+.08)}catch(e){}}
function hit(j){if(phase!=='race'||$('left').disabled||last===j)return;last=j;send({type:'hit',key:j});tone();let b=$(j?'right':'left');b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),65)}$('left').onpointerdown=e=>{e.preventDefault();hit(0)};$('right').onpointerdown=e=>{e.preventDefault();hit(1)};$('left').onclick=e=>{if(!e.detail)hit(0)};$('right').onclick=e=>{if(!e.detail)hit(1)};document.addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT')return;if(['a','d'].includes(e.key.toLowerCase())){e.preventDefault();hit(e.key.toLowerCase()==='a'?0:1)}});$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');$('start').onclick=()=>send({type:'start'});$('sound').onclick=()=>{sound=!sound;$('sound').textContent='소리 '+(sound?'ON':'OFF')};$('copy').onclick=async()=>{let link=location.origin+'/?room='+room;try{await navigator.clipboard.writeText(link);status.textContent='초대 링크 복사 완료'}catch(e){prompt('친구에게 보낼 링크',link)}};$('code').value=new URLSearchParams(location.search).get('room')||'';
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function line(x,y,X,Y,w,col){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.lineWidth=w+3;g.strokeStyle='#242039';g.stroke();g.lineWidth=w;g.strokeStyle=col;g.stroke()}function text(s,x,y,size,col){g.font='bold '+size+'px monospace';g.fillStyle='#172035';g.fillText(s,x+2,y+2);g.fillStyle=col;g.fillText(s,x,y)}function runner(x,y,a){let s=Math.sin(a.phase),b=Math.cos(a.phase);g.save();g.translate(x,y-Math.abs(s)*3);g.fillStyle='#633144';g.beginPath();g.ellipse(0,4,23,5,0,0,7);g.fill();line(-5,-25,s*20-8,-10,10,'#b47652');line(s*20-8,-10,-s*13-8,0,7,'#354361');box(-s*13-14,-4,15,6,'#dce8ed');line(5,-25,-s*20+8,-10,11,'#f0b17c');line(-s*20+8,-10,s*13+8,0,8,'#536485');box(s*13+3,-4,17,6,'#fff0d1');line(-6,-47,-b*17-8,-33,11,'#b77b54');box(-15,-54,31,29,'#252039');box(-12,-51,27,23,a.col);box(-9,-49,19,5,'#ffffff55');box(-10,-28,24,6,'#27283d');line(12,-47,b*17+14,-33,12,'#f5bd84');line(b*17+14,-33,b*5+21,-45,8,'#ffc990');box(1,-73,22,23,'#272238');box(4,-69,20,17,'#f3b77e');box(3,-75,21,8,a.col);box(18,-65,5,3,'#242039');text((a.i+1)+'P',-11,-81,14,a.col);if(a.hit>0){for(let k=0;k<7;k++)box(-24-k*5,-2-(k%3)*4,4+k%3,3,'#ffe0a6');box(-21,-2,12,3,'#fff5cb')}g.restore()}function draw(t){let lead=Math.max(0,...P.map(a=>a.p));let sky=g.createLinearGradient(0,0,0,130);sky.addColorStop(0,'#23649b');sky.addColorStop(1,'#a1e2ea');g.fillStyle=sky;g.fillRect(0,0,800,420);for(let i=0;i<18;i++){let x=((i*61-lead*.12)%850+850)%850-25,h=20+i*17%55;box(x,80-h,30,h,'#527c9c');for(let j=0;j<3;j++)box(x+5+j*8,85-h,3,6,'#b3cbd4')}box(0,72,800,56,'#263e61');box(0,74,800,5,'#e8e2d7');for(let i=0;i<320;i++){let x=i*47%800,y=84+Math.floor(i/100)*11+(active?Math.sin(t*5+i)>0?2:0:0);box(x,y,5,4,'#edb58b');box(x-1,y+4,7,6,colors[i%4])}box(0,123,800,6,'#dce9e8');for(let i=0;i<4;i++){let y=129+i*73;box(0,y,800,73,i%2?'#a74c3d':'#b45642');box(0,y,800,3,'#f3d8b4');for(let k=0;k<23;k++){let x=((k*39-lead*2.7)%900+900)%900-30;box(x,y+58,19,2,'#d17b5e')}text('LANE '+(i+1),8,y+18,12,'#f8d8b0')}let finish=200+(D-lead)*2.1;if(finish<800)for(let i=0;i<29;i++)for(let j=0;j<2;j++)box(finish+j*8,129+i*10,8,10,(i+j)%2?'#20243a':'#fff3d9');P.forEach(a=>{let x=Math.max(55,200+(a.p-lead)*2.1);runner(x,195+a.i*73,a);if(a.v>55&&a.time===null)for(let j=0;j<7;j++)box(x-30-((j*29+t*210)%110),175+a.i*73+j%3*8,13+j%3*5,2,'#fce2b7');$('m'+a.i).style.width=a.v+'%';$('d'+a.i).textContent=a.time===null?Math.floor(a.p)+'m · '+a.v.toFixed(1)+'%':(order.indexOf(a.i)+1)+'위 · '+a.time.toFixed(2)+'초'});text(t<0?String(Math.ceil(-t)):t.toFixed(2)+' SEC',18,40,28,'#ffe36b');text('1500M',650,40,23,'#fff');if(!active&&!order.length)text('READY TO RACE',280,66,28,'#ffe36b')}
draw(0);</script></html>
